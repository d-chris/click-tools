[tox]
requires =
    tox>=4.2
env_list =
    3.{15, 14, 13, 12, 11, 10, 9}{, -pillow}
no_package = true

[testenv]
skip_install = true
set_env =
    COVERAGE_FILE = {env_dir}/.coverage
    pillow: POETRY_EXTRAS = -E pillow
commands_pre =
    poetry install --sync --no-interaction --only main,test {env:POETRY_EXTRAS:}
commands =
    poetry run pytest {posargs:-v}
allowlist_externals =
    poetry
